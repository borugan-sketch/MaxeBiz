<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoppable Experience</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Main Media Stage -->
        <div id="stage">
            <div id="media-container">
                <img id="main-image" src="assets/images/videocom.png" alt="Scene">
                <!-- Video or Model Viewer can be injected here -->
            </div>
            <div id="hotspots-layer">
                <!-- Hotspots injected by JS -->
            </div>
        </div>

        <!-- UI Overlays -->
        <header id="top-bar">
            <div class="logo">SHOPPABLE</div>
            <div class="top-actions">
                <button id="support-btn" class="icon-btn"><span class="material-icons">help_outline</span></button>
            </div>
        </header>

        <div id="nav-arrows">
            <button id="prev-btn" class="nav-arrow"><span class="material-icons">chevron_left</span></button>
            <button id="next-btn" class="nav-arrow"><span class="material-icons">chevron_right</span></button>
        </div>

        <!-- Bottom Navigation -->
        <button id="menu-btn" class="icon-btn fab-small bottom-left"><span class="material-icons">menu</span></button>
        <button id="search-btn" class="icon-btn fab-small bottom-center"><span class="material-icons">search</span></button>

        <!-- Persistent Cart Button (Floating) -->
        <button id="cart-fab" class="floating-fab">
            <span class="material-icons">shopping_bag</span>
            <span id="cart-count" class="badge">0</span>
            <span id="cart-total" class="total">$0.00</span>
        </button>

        <!-- Product Modal -->
        <div id="product-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-content glass">
                <button class="close-modal"><span class="material-icons">close</span></button>
                <div id="modal-body">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <!-- Cart Drawer -->
        <div id="cart-drawer" class="drawer right">
            <div class="drawer-header">
                <h2>Your Cart</h2>
                <button class="close-drawer"><span class="material-icons">close</span></button>
            </div>
            <div id="cart-items"></div>
            <div class="cart-footer">
                <div class="cart-summary">Total: <span id="drawer-total">$0.00</span></div>
                <div class="cart-actions">
                    <button onclick="startCheckout('rfq')" class="secondary-btn full-width mb-10">Request Quote</button>
                    <button onclick="startCheckout('order')" class="primary-btn full-width">Checkout Now</button>
                </div>
            </div>
        </div>

        <!-- Checkout Form Overlay -->
        <div id="checkout-overlay" class="modal hidden">
             <div class="modal-backdrop"></div>
             <div class="modal-content glass">
                <h2>Checkout</h2>
                <button class="close-modal"><span class="material-icons">close</span></button>
                <form id="checkout-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="phone" required placeholder="+1234567890">
                    </div>
                    <div class="form-group">
                        <label>Delivery Address</label>
                        <textarea id="address" required placeholder="Street, City, Zip"></textarea>
                        <button type="button" id="geo-btn" class="secondary-btn mt-10">📍 Auto-Detect Location</button>
                    </div>

                    <div id="payment-options" class="form-group" style="display:none;">
                        <label>Payment Method</label>
                        <div class="radio-group">
                            <label><input type="radio" name="payment" value="online" disabled> Online Payment (Coming Soon)</label>
                            <label><input type="radio" name="payment" value="offline" checked> Offline / COD / Bank Transfer</label>
                        </div>
                    </div>

                    <button type="submit" class="primary-btn full-width mt-20">Confirm</button>
                </form>
             </div>
        </div>

        <!-- Menu Drawer -->
        <div id="menu-drawer" class="drawer left">
            <div class="drawer-header">
                <h2>Menu</h2>
                <button class="close-menu"><span class="material-icons">close</span></button>
            </div>
            <ul class="menu-list">
                <li><a href="#">Collections</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Policies</a></li>
                <li><a href="/admin/">Admin</a></li>
            </ul>
        </div>

        <!-- Support Dropdown -->
        <div id="support-dropdown" class="dropdown hidden">
             <a href="mailto:support@example.com">Email Us</a>
             <a href="tel:+123456789">Call Us</a>
             <a href="#">FAQ</a>
        </div>

    </div>
    <script src="js/app.js"></script>
</body>
</html>
